<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소담</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <!--알림-->
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-shell">
      <!--좌측 사이드바 화면 전환-->

      <nav class="sidebar">
        <div class="logo">
          <!-- <img src="img/logo.png" alt="Logo"> 로고가 꼭 필요한가??-->

          <div class="logo-text">
            <h2>소담가계부</h2>
            <p>SODAM</p>
          </div>
        </div>

        <button class="nav-btn active" data-target="ledger">
          <i class="bi bi-wallet2"></i>
          <span>가계부</span>
        </button>

        <button class="nav-btn" data-target="stats">
          <i class="bi bi-bar-chart"></i>
          <span>통계</span>
        </button>

        <button class="nav-btn" data-target="ai">
          <i class="bi bi-stars"></i>
          <span>AI</span>
        </button>
      </nav>

      <!-- 가계부 화면 -->
      <!--ledger  : 회계-->
      <section id="ledger" class="screen active">
        <!-- 월 이동 -->
        <div class="month-nav">
          <button class="nav-arrow prev-month" onclick="leftArrowClick()">
            ‹
          </button>
          <span class="month-label">0000년 00월</span>
          <button class="nav-arrow next-month" onclick="rightArrowClick()">
            ›
          </button>
        </div>

        <!-- 수입/지출/합계 -->
        <!--summary : 요약-->
        <div class="summary-strip">
          <div class="summary-cell">
            <p class="summary-label">수입</p>
            <p class="summary-value income" id="totalIncome">0</p>
          </div>
          <div class="summary-cell">
            <p class="summary-label">지출</p>
            <p class="summary-value expense" id="totalExpense">0</p>
          </div>
          <div class="summary-cell">
            <p class="summary-label">합계</p>
            <p class="summary-value" id="totalBalance">0</p>
          </div>
        </div>

        <!-- 전월 대비 문장 -->
        <div
          class="insight-banner"
          id="insightBanner"
          style="display: none"
        ></div>

        <!-- 입력 폼 -->
        <!--entry : 들어가다, 입력-->
        <form class="entry-form" id="entryForm">
          <div class="form-row">
            <input type="date" id="inputDate" />
            <input type="time" id="inputTime" />

            <select id="inputType" onchange="updateCategoryOptions()">
              <option value="expense" selected>지출</option>
              <option value="income">수입</option>
            </select>

            <select id="inputCategory"></select>

            <!--필터링기능-->
            <div id="filter">
              <div>
                <input type="checkbox" id="all" checked />
                <label for="all">전체</label>

                <input
                  type="checkbox"
                  id="food"
                  class="categoryFilter"
                  value="food"
                />
                <label for="food">식비</label>

                <input
                  type="checkbox"
                  id="shopping"
                  class="categoryFilter"
                  value="shopping"
                />
                <label for="shopping">쇼핑</label>

                <input
                  type="checkbox"
                  id="transport"
                  class="categoryFilter"
                  value="transport"
                />
                <label for="transport">교통</label>

                <input
                  type="checkbox"
                  id="living"
                  class="categoryFilter"
                  value="living"
                />
                <label for="living">생활</label>

                <!-- culture -> leisure 수정 -->
                <input
                  type="checkbox"
                  id="culture"
                  class="categoryFilter"
                  value="leisure"
                />
                <label for="culture">문화·여가</label>

                <input
                  type="checkbox"
                  id="fixed"
                  class="categoryFilter"
                  value="fixed"
                />
                <label for="fixed">고정지출</label>

                <!-- etc -> other 수정 -->
                <input
                  type="checkbox"
                  id="etc"
                  class="categoryFilter"
                  value="other"
                />
                <label for="etc">기타</label>
              </div>
            </div>
          </div>

          <div class="form-row">
            <input
              type="text"
              id="inputAmount"
              placeholder="금액"
              inputmode="numeric"
            />
            <input type="text" id="inputContent" placeholder="내용" />
            <button type="submit" class="add-btn">추가</button>
          </div>
          <p id="formError" class="form-error"></p>
        </form>
        <!-- 날짜별 기록 목록 -->
        <div class="record-list" id="recordList"></div>

        <!-- <div class="test">
        <div class="test-btn">ai
          <button class="close-btn" onclick="onTestBox()">버튼</button>
        </div>
        <div class="box">ai 들어갈 사각형 상자</div>
      </div> -->
      </section>
      <!-- 통계 화면 -->
      <section id="stats" class="screen">
        <!-- 현재 선택된 월 -->
        <div class="month-nav">
          <button class="nav-arrow prev-month" onclick="leftArrowClick()">
            ‹
          </button>
          <span class="month-label">0000년 00월</span>
          <button class="nav-arrow next-month" onclick="rightArrowClick()">
            ›
          </button>
        </div>

        <!-- 이번 달 요약 -->
        <div class="stats-summary">
          <div class="stats-summary-item">
            <span class="stats-summary-label">최다 지출일</span>
            <strong id="analysisText">-</strong>
          </div>
          <div class="stats-summary-item">
            <span class="stats-summary-label">하루 평균</span>
            <strong id="analysisText2">-</strong>
          </div>
          <div class="stats-summary-item">
            <span class="stats-summary-label">최다 카테고리</span>
            <strong id="analysisText3">-</strong>
          </div>
        </div>
        <!-- 한 화면에 다 모아서 -->
        <div class="stats-dashboard">
          <!-- 카테고리 비율 -->
          <div class="dash-card">
            <div class="stats-section-title">
              <div><h3>카테고리 비율</h3></div>
            </div>
            <div class="stats-layout stats-layout-sm">
              <div class="doughnut-wrap doughnut-wrap-sm">
                <canvas id="doughnutChart"></canvas>
              </div>
              <div class="stat-list" id="statList"></div>
            </div>
          </div>

          <!-- 소비 추이 -->
          <div class="dash-card">
            <div class="stats-section-title">
              <div><h3>소비 추이</h3></div>
              <div class="period-toggle">
                <button class="period-btn active" data-period="6m">
                  최근 6개월
                </button>
                <button class="period-btn" data-period="1y">올해</button>
              </div>
            </div>

            <div class="category-filter" id="barCategoryFilter">
              <button class="filter-chip active" data-cat="all">전체</button>
              <button class="filter-chip" data-cat="food">
                <span class="dot food"></span>식비
              </button>
              <button class="filter-chip" data-cat="shopping">
                <span class="dot shopping"></span>쇼핑
              </button>
              <button class="filter-chip" data-cat="transport">
                <span class="dot transport"></span>교통
              </button>
              <button class="filter-chip" data-cat="living">
                <span class="dot living"></span>생활
              </button>
              <button class="filter-chip" data-cat="leisure">
                <span class="dot leisure"></span>문화·여가
              </button>
              <button class="filter-chip" data-cat="fixed">
                <span class="dot fixed"></span>고정지출
              </button>
              <button class="filter-chip" data-cat="other">
                <span class="dot other"></span>기타
              </button>
            </div>

            <div class="trend-chart-wrap trend-chart-wrap-sm">
              <canvas id="barChart"></canvas>
            </div>
          </div>

          <!-- 소비 패턴 -->
          <div class="dash-card">
            <div class="stats-section-title">
              <div><h3>소비 패턴</h3></div>
            </div>
            <div class="heatmap-wrap">
              <div class="heatmap-weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span
                ><span>목</span><span>금</span><span>토</span>
              </div>
              <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>
          </div>
        </div>
      </section>
      <!-- AI 질문 화면 -->
      <section id="ai" class="screen">
        <h2>AI</h2>

        <div id="chat-container">
          <div id="ai-chat-box"></div>

          <div id="user-input">
            <input
              id="ai-user-input"
              type="text"
              placeholder="소비에 대해 질문하세요..."
            />
            <button id="ai-send-btn">전송</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Chart.js 라이브러리 사용-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/data.js"></script>
    <script src="js/calculate.js"></script>
    <script src="js/render.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/alarm.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="./js/ai.js"></script>
  </body>
</html>
