<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소담</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="app-shell">
    <!--좌측 사이드바 화면 전환-->

    <nav class="sidebar">
      <div class="logo">
        <img src="img/logo.png" alt="Logo">

        <div class="logo-text">
          <h2>소담가계부</h2>
          <p>SODAM</p>
        </div>
      </div>

      <button class="nav-btn active" data-target="ledger">
        <i class="bi bi-wallet2"></i>
        <span>가계부</span>
      </button>

      <button class="nav-btn" data-target="stats">
        <i class="bi bi-bar-chart"></i>
        <span>통계</span>
      </button>

      <!-- <button class="nav-btn" data-target="ai">
        <i class="bi bi-stars"></i>
        <span>AI 질문</span>
      </button> -->
    </nav>

    <!-- 가계부 화면 -->
    <!--ledger  : 회계-->
    <section id="ledger" class="screen active">

      <!-- 월 이동 -->
      <div class="month-nav">
        <button class="nav-arrow prev-month" onclick="leftArrowClick()">‹</button>
        <span class="month-label">0000년 00월</span>
        <button class="nav-arrow next-month" onclick="rightArrowClick()">›</button>
      </div>
      <!-- 현재의 총잔고 (수정 가능)
      <div class="balance-input">
        <label for="currentBalance">현재 총잔고:</label>
        <input type="number" id="currentBalance" name="currentBalance" />
      </div> -->

      <!-- 수입/지출/합계 -->
      <!--summary : 요약-->
      <div class="summary-strip">
        <div class="summary-cell">
          <p class="summary-label">수입</p>
          <p class="summary-value income" id="totalIncome">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">지출</p>
          <p class="summary-value expense" id="totalExpense">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">합계</p>
          <p class="summary-value" id="totalBalance">0</p>
        </div>
      </div>

      <!-- 전월 대비 문장 -->
      <div class="insight-banner" id="insightBanner" style="display: none"></div>

      <!-- 입력 폼 -->
      <!--entry : 들어가다, 입력-->
      <form class="entry-form" id="entryForm">
        <div class="form-row">
          <input type="date" id="inputDate" />
          <input type="time" id="inputTime" />

          <select id="inputType" onchange="updateCategoryOptions()">
            <option value="expense" selected>지출</option>
            <option value="income">수입</option>
          </select>

          <select id="inputCategory">
          </select>
        </div>

        <div class="form-row">
          <input type="text" id="inputAmount" placeholder="금액" inputmode="numeric" />
          <input type="text" id="inputContent" placeholder="내용" />
          <button type="submit" class="add-btn">추가</button>
        </div>
        <p id="formError" class="form-error"></p>
      </form>

      <!-- 날짜별 기록 목록 -->
      <div class="record-list" id="recordList"></div>

      <div class="test">
        <div class="test-btn">ai
          <button class="close-btn" onclick="onTestBox()">버튼</button>
        </div>
        <div class="box">ai 들어갈 사각형 상자</div>
      </div>
    </section>
    <!-- 통계 화면 -->
    <section id="stats" class="screen">

      <!-- 현재 선택된 월 -->
      <div class="month-nav">
        <button class="nav-arrow prev-month" onclick="leftArrowClick()">‹</button>
        <span class="month-label">0000년 00월</span>
        <button class="nav-arrow next-month" onclick="rightArrowClick()">›</button>
      </div>


      <!-- 이번 달 요약 -->
      <div class="summary-strip">
        <div class="summary-cell">
          <p class="summary-label">수입</p>
          <p class="summary-value income" id="totalIncome">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">지출</p>
          <p class="summary-value expense" id="totalExpense">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">합계</p>
          <p class="summary-value" id="totalBalance">0</p>
        </div>
      </div>

      <!--이번 달 분석 문장 넣을 곳-->
      <!--analysis : 분석-->
      <div class="analysis">
        <div>
          <p id="analysisText">이번달 가장 많이 지출한 날</p>
        </div>
        <div>
          <p id="analysisText2">이번달 하루 평균 지출</p>
        </div>
        <div>
          <p id="analysisText3">이번 달 가장 많이 지출한 카테고리</p>
        </div>
      </div>


      <!-- 통계 탭 -->
      <!--segment : 구간, 부분-->
      <div class="segment-group">

        <button class="segment-btn active" data-view="pie">
          카테고리 비율
        </button>

        <button class="segment-btn" data-view="bar">
          소비 추이
        </button>

      </div>


      <!-- 카테고리 비율 -->
      <div class="stat-view active" id="view-pie">

        <div class="stats-section-title">
          <div>
            <h3>이번 달 소비</h3>
            <p>카테고리별 지출 비율</p>
          </div>
        </div>


        <div class="stats-layout">
          <!-- 도넛 -->
          <div class="doughnut-wrap">
            <canvas id="doughnutChart"></canvas>
          </div>
          <!-- 카테고리 목록 -->
          <div class="stat-list" id="statList">
          </div>

        </div>

      </div>

      <!-- 소비 -->
      <div class="stat-view" id="view-bar">
        <div class="stats-section-title">
          <div>
            <h3>소비 추이</h3>
            <p>월별 수입과 지출의 변화 확인</p>
          </div>

          <!-- 기간 -->
          <div class="period-toggle">

            <button class="period-btn active" data-period="6m">
              최근 6개월
            </button>
            <button class="period-btn" data-period="1y">
              올해
            </button>

          </div>

        </div>

        <!-- 카테고리 필터 -->
        <div class="category-filter" id="barCategoryFilter">

          <button class="filter-chip active" data-cat="all">
            전체
          </button>

          <button class="filter-chip" data-cat="food">
            <span class="dot food"></span>
            식비
          </button>

          <button class="filter-chip" data-cat="shopping">
            <span class="dot shopping"></span>
            쇼핑
          </button>

          <button class="filter-chip" data-cat="transport">
            <span class="dot transport"></span>
            교통
          </button>

          <button class="filter-chip" data-cat="living">
            <span class="dot living"></span>
            생활
          </button>

          <button class="filter-chip" data-cat="leisure">
            <span class="dot leisure"></span>
            문화·여가
          </button>

          <button class="filter-chip" data-cat="fixed">
            <span class="dot fixed"></span>
            고정지출
          </button>

          <button class="filter-chip" data-cat="other">
            <span class="dot other"></span>
            기타
          </button>

        </div>


        <!-- 그래프 -->
        <!--trend : 추세, 추이-->
        <div class="trend-chart-wrap">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </section>

    <!--ai질문 화면 창 위에 창 띄우기 js!! 디자인 변경-->
    <!-- AI 질문 화면 -->
    <section id="ai" class="screen">
      <h2>AI 소비 분석 및 질문</h2>

      <div id="chat-container">
        <div id="ai-chat-box"></div>

        <div id="user-input">
          <input id="ai-user-input" type="text" placeholder="소비에 대해 질문하세요..." />
          <button onclick="sendAIQuestion()">전송</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Chart.js 라이브러리 사용-->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calculate.js"></script>
  <script src="js/render.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ai.js"></script>
</body>

</html>
