<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소담</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="app-shell">
    <!-- 좌측 사이드바: 화면 전환 -->
    <nav class="sidebar">
      <button class="nav-btn active" data-target="ledger"><i class="bi bi-calculator"></i><br>가계부</button>
      <button class="nav-btn" data-target="stats"><i class="bi bi-bar-chart"></i><br>통계</button>
      <button class="nav-btn" data-target="ai"><i class="bi bi-stars"></i><br>AI질문</button>
    </nav>

    <!-- 가계부 화면 -->
    <section id="ledger" class="screen active">

      <!-- 월 이동 -->
      <div class="month-nav">
        <button class="nav-arrow prev-month" onclick="leftArrowClick()">‹</button>
        <span class="month-label">0000년 00월</span>
        <button class="nav-arrow next-month" onclick="rightArrowClick()">›</button>
      </div>
      <!-- 현재의 총잔고 (수정 가능)
      <div class="balance-input">
        <label for="currentBalance">현재 총잔고:</label>
        <input type="number" id="currentBalance" name="currentBalance" />
      </div> -->

      <!-- 수입/지출/합계 -->
      <div class="summary-strip">
        <div class="summary-cell">
          <p class="summary-label">수입</p>
          <p class="summary-value income" id="totalIncome">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">지출</p>
          <p class="summary-value expense" id="totalExpense">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">합계</p>
          <p class="summary-value" id="totalBalance">0</p>
        </div>
      </div>

      <!-- 전월 대비 문장 -->
      <div class="insight-banner" id="insightBanner" style="display: none"></div>

      <!-- 입력 폼 -->
      <form class="entry-form" id="entryForm">
        <div class="form-row">
          <input type="date" id="inputDate" />
          <input type="time" id="inputTime" />

          <select id="inputType" onchange="updateCategoryOptions()">
            <option value="expense" selected>지출</option>
            <option value="income">수입</option>
          </select>

          <select id="inputCategory">
          </select>
        </div>

        <div class="form-row">
          <input type="text" id="inputAmount" placeholder="금액" inputmode="numeric" />
          <input type="text" id="inputContent" placeholder="내용" />
          <button type="submit" class="add-btn">추가</button>
        </div>
        <p id="formError" class="form-error"></p>
      </form>

      <!-- 날짜별 기록 목록 -->
      <div class="record-list" id="recordList"></div>
    </section>

    <!-- 통계 화면 -->
    <section id="stats" class="screen">

      <div class="month-nav">
        <button class="nav-arrow prev-month" onclick="leftArrowClick()">‹</button>
        <span class="month-label">0000년 00월</span>
        <button class="nav-arrow next-month" onclick="rightArrowClick()">›</button>
      </div>

      <!-- 탭 -->
      <div class="segment-group">
        <button class="segment-btn active" data-view="pie">카테고리 비율</button>
        <button class="segment-btn" data-view="bar">카테고리 비교</button>
      </div>

      <!-- 카테고리 비율 -->
      <div class="stat-view active" id="view-pie">
        <div class="stats-layout">
          <div class="chart-box" style="position: relative; width: 260px; height: 260px; flex-shrink: 0;">
            <!-- 도넛 차트 -->
            <canvas id="doughnutChart"></canvas>
          </div>
          <div class="stat-list" id="statList">
          </div>
        </div>
      </div>
      <!-- 기간별 -->
      <div class="stat-view" id="view-bar">

        <div class="bar-controls">
          <div class="period-toggle">
            <button class="period-btn active" data-period="6m">최근 6개월</button>
            <button class="period-btn" data-period="1y">올해</button>
          </div>
        </div>

        <div class="category-filter" id="barCategoryFilter">
          <button class="filter-chip active" data-cat="all">전체</button>
          <button class="filter-chip" data-cat="food"><span class="dot food"></span>식비</button>
          <button class="filter-chip" data-cat="shopping"><span class="dot shopping"></span>쇼핑</button>
          <button class="filter-chip" data-cat="transport"><span class="dot transport"></span>교통</button>
          <button class="filter-chip" data-cat="living"><span class="dot living"></span>생활</button>
          <button class="filter-chip" data-cat="leisure"><span class="dot leisure"></span>문화·여가</button>
          <button class="filter-chip" data-cat="fixed"><span class="dot fixed"></span>고정지출</button>
          <button class="filter-chip" data-cat="other"><span class="dot other"></span>기타</button>
        </div>

        <!-- Chart.js 바 차트 영역 -->
        <div class="chart-box" style="position: relative; width: 100%; height: 300px;">
          <canvas id="barChart"></canvas>
        </div>

      </div>

    </section>

    <!-- AI 질문 화면 -->
    <section id="ai" class="screen">
      <h2>AI 소비 분석 및 질문</h2>

      <div id="chat-container">
        <div id="ai-chat-box"></div>

        <div id="user-input">
          <input id="ai-user-input" type="text" placeholder="소비에 대해 질문하세요..." />
          <button onclick="sendAIQuestion()">전송</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calculate.js"></script>
  <script src="js/render.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ai.js"></script>
</body>

</html>
