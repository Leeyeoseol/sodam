<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소담</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app-shell">
    <!-- 좌측 사이드바: 화면 전환 -->
    <nav class="sidebar">
      <button class="nav-btn active" data-target="ledger">가계부</button>
      <button class="nav-btn" data-target="stats">통계</button>
    </nav>
    <!-- 가계부 화면 -->
    <section id="ledger" class="screen active">
      <!-- 월 이동 -->
      <div class="month-nav">
        <button class="nav-arrow prev-month" onclick="leftArrowClick()">‹</button>
        <span class="month-label">0000년 00월</span>
        <button class="nav-arrow next-month" onclick="rightArrowClick()">›</button>
      </div>

      <!-- 수입/지출/합계 : -->
      <div class="summary-strip">
        <div class="summary-cell">
          <p class="summary-label">수입</p>
          <p class="summary-value income" id="totalIncome">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">지출</p>
          <p class="summary-value expense" id="totalExpense">0</p>
        </div>
        <div class="summary-cell">
          <p class="summary-label">합계</p>
          <p class="summary-value" id="totalBalance">0</p>
        </div>
      </div>

      <!-- 전월 대비 문장 -->
      <div class="insight-banner" id="insightBanner" style="display: none"></div>

      <!-- 입력 폼 -->
      <form class="entry-form" id="entryForm">
        <div class="form-row">
          <input type="date" id="inputDate" />
          <input type="time" id="inputTime" />
          <select id="inputCategory">
            <option value="" selected disabled hidden>선택</option>
            <option value="food">식비</option>
            <option value="shopping">쇼핑</option>
            <option value="transport">교통</option>
            <option value="living">생활</option>
            <option value="leisure">문화·여가</option>
            <option value="fixed">고정지출</option>
            <option value="income">수입</option>
            <option value="other">기타</option>
          </select>
        </div>
        <div class="form-row">
          <input type="text" id="inputAmount" placeholder="금액" inputmode="numeric" />
          <input type="text" id="inputContent" placeholder="내용" />
          <button type="submit" class="add-btn">추가</button>
        </div>
        <p id="formError" class="form-error"></p>
      </form>

      <!-- 날짜별 기록 목록:  -->
      <div class="record-list" id="recordList">
        <details>
          <summary>15일</summary>
          <ul id="List"> </ul>
        </details>
      </div>
    </section>
    <!-- 통계 화면 -->
    <section id="stats" class="screen">

      <div class="month-nav">
        <button class="nav-arrow prev-month" onclick="leftArrowClick()">‹</button>
        <span class="month-label">0000년 00월</span>
        <button class="nav-arrow next-month" onclick="rightArrowClick()">›</button>
      </div>

      <div class="stats-layout">
        <div class="pie-wrap">
          <div class="pie"></div>
          <div class="pie-hole">
            <span class="pie-amount">320,000</span>
            <span class="pie-label">총 지출</span>
          </div>
        </div>

        <div class="stat-list">
          <div class="stat-row">
            <span class="stat-dot food"></span>
            <span class="stat-name">식비</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot shopping"></span>
            <span class="stat-name">쇼핑</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot transport"></span>
            <span class="stat-name">교통</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot living"></span>
            <span class="stat-name">생활</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot leisure"></span>
            <span class="stat-name">문화·여가</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot fixed"></span>
            <span class="stat-name">고정지출</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot income"></span>
            <span class="stat-name">수입</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>

          <div class="stat-row">
            <span class="stat-dot other"></span>
            <span class="stat-name">기타</span>
            <span class="stat-pct">12.5%</span>
            <span class="stat-amount">40,000원</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/calculate.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
